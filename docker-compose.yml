services:
  postgres:
    image: postgres:15-alpine
    container_name: poker-pocket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: database_user
      POSTGRES_PASSWORD: database_password
      POSTGRES_DB: PokerPocket
    ports:
      - "5432:5432"
    volumes:
      - poker_pocket_pg_data:/var/lib/postgresql/data

volumes:
  poker_pocket_pg_data:
